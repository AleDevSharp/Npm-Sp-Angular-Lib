<!-- Region: Accordion Root Container -->
<div
  class="sp-accordion"
  [class.sp-accordion--contained]="variant() === 'contained'"
  [class.sp-accordion--separated]="variant() === 'separated'"
  [class.sp-accordion--ghost]="variant() === 'ghost'"
  [class.sp-accordion--sm]="size() === 'sm'"
  [class.sp-accordion--md]="size() === 'md'"
  [class.sp-accordion--lg]="size() === 'lg'">
  <ng-content></ng-content>
</div>
