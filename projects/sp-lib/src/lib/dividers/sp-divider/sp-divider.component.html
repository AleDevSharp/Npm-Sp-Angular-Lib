<!-- Region: Divider with Label -->
@if (this.label()) {
  <div
    class="sp-divider-with-label"
    [style.margin-top]="this.marginTop()"
    [style.margin-bottom]="this.marginBottom()">
    <span class="sp-divider-line" [style.border-bottom-width]="this.borderWidth()" [style.border-bottom-style]="this.borderStyle()" [style.border-bottom-color]="this.borderColor() || this.color() || null"></span>
    <span class="sp-divider-label-text" [style.color]="this.labelColor() || null">
      {{ this.label() }}
    </span>
    <span class="sp-divider-line" [style.border-bottom-width]="this.borderWidth()" [style.border-bottom-style]="this.borderStyle()" [style.border-bottom-color]="this.borderColor() || this.color() || null"></span>
  </div>
}

<!-- Region: Divider Line Only -->
@if (!this.label()) {
  <div
    class="sp-divider-line-only"
    [class.is-vertical]="this.orientation() === 'vertical'"
    [class.is-horizontal]="this.orientation() === 'horizontal'"
    [style.margin-top]="this.marginTop()"
    [style.margin-bottom]="this.marginBottom()"
    [style.border-bottom-style]="this.orientation() === 'horizontal' ? this.borderStyle() : null"
    [style.border-bottom-width]="this.orientation() === 'horizontal' ? this.borderWidth() : null"
    [style.border-bottom-color]="this.orientation() === 'horizontal' ? (this.borderColor() || this.color() || null) : null"
    [style.border-left-style]="this.orientation() === 'vertical' ? this.borderStyle() : null"
    [style.border-left-width]="this.orientation() === 'vertical' ? this.borderWidth() : null"
    [style.border-left-color]="this.orientation() === 'vertical' ? (this.borderColor() || this.color() || null) : null"
    [style.height]="this.orientation() === 'vertical' ? this.height() : null"></div>
}
