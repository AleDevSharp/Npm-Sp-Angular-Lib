<!-- Region: Switch Wrapper -->
<div class="sp-switch-wrapper">
  <div
    class="sp-switch-control"
    [class.is-disabled]="this.effectiveDisabled()"
    (click)="this.toggle()">
    <!-- Region: Visual Track -->
    <div
      class="sp-switch-track"
      role="switch"
      tabindex="0"
      [id]="this.id()"
      [attr.aria-checked]="this.checked()"
      [attr.aria-disabled]="this.effectiveDisabled()"
      [attr.aria-label]="this.label() || 'Switch toggle'"
      [class.sp-switch-sm]="this.size() === 'sm'"
      [class.sp-switch-md]="this.size() === 'md'"
      [class.sp-switch-lg]="this.size() === 'lg'"
      [class.is-checked]="this.checked()"
      [class.has-error]="this.hasError()"
      [style.width]="this.width() || null"
      [style.height]="this.height() || null"
      [style.--sp-switch-active-bg]="this.activeColor() || null"
      [style.--sp-switch-inactive-bg]="this.inactiveColor() || null"
      (keydown)="this.onKeyDown($event)">
      <!-- Region: Visual Thumb -->
      <span
        class="sp-switch-thumb"
        [style.background-color]="this.thumbColor() || null"></span>
    </div>

    <!-- Region: Label -->
    @if (this.label()) {
      <label
        class="sp-switch-label"
        [attr.for]="this.id()"
        [style.color]="this.labelColor() || null">
        {{ this.label() }}
      </label>
    }
  </div>

  <!-- Region: Error Message -->
  @if (this.hasError() && this.errorMessage()) {
    <p
      class="sp-switch-error"
      role="alert">
      {{ this.errorMessage() }}
    </p>
  }
</div>
