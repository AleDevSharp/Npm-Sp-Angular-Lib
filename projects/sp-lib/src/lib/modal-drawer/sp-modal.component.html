@if (visible()) {
  <div
    class="sp-modal-overlay"
    [class.sp-modal-backdrop-none]="!backdrop()"
    [class.sp-modal-blur]="backdrop() && backdropBlur()"
    [class.sp-modal-centered]="centered()"
    (click)="onBackdropClick($event)">
    <div
      #dialogContainer
      class="sp-modal-dialog"
      [class]="'sp-modal-' + size()"
      role="dialog"
      aria-modal="true"
      tabindex="-1"
      [attr.aria-labelledby]="title() ? titleId : null">
      <!-- Header -->
      <div class="sp-modal-header">
        <ng-content select="[spModalHeader]"></ng-content>
        @if (title()) {
          <h3
            [id]="titleId"
            class="sp-modal-title">
            {{ title() }}
          </h3>
        }
        @if (showCloseButton()) {
          <button
            type="button"
            class="sp-modal-close-btn"
            aria-label="Chiudi finestra modale"
            (click)="close()">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round">
              <line
                x1="18"
                y1="6"
                x2="6"
                y2="18"></line>
              <line
                x1="6"
                y1="6"
                x2="18"
                y2="18"></line>
            </svg>
          </button>
        }
      </div>

      <!-- Body Content -->
      <div class="sp-modal-body">
        <ng-content></ng-content>
      </div>

      <!-- Footer Actions -->
      <div class="sp-modal-footer">
        <ng-content select="[spModalFooter]"></ng-content>
      </div>
    </div>
  </div>
}
