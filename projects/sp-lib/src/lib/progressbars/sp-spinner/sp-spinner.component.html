<!-- Region: Spinner -->
<div
  class="sp-spinner"
  role="status"
  aria-label="Loading"
  [style.--sp-spinner-color]="this.primaryColor()"
  [style.width.px]="this.size()"
  [style.height.px]="this.size()"
  [style.animation-duration]="this.animationSpeed()">
  <span class="sp-spinner-sr-only">Loading...</span>
</div>
