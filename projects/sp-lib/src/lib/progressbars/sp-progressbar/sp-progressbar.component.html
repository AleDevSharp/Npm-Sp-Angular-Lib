<!-- Region: Progressbar Template -->
<div
  class="sp-progressbar-track"
  role="progressbar"
  [attr.aria-valuenow]="!this.indeterminate() ? this.percentage() : null"
  aria-valuemin="0"
  aria-valuemax="100"
  [style.height]="this.height()">
  <div
    class="sp-progressbar-fill"
    [class.is-indeterminate]="this.indeterminate()"
    [style.width.%]="!this.indeterminate() ? this.percentage() : null"
    [style.background-color]="this.color()"></div>
</div>
