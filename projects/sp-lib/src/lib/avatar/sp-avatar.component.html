<!-- Region: Avatar Root -->
<div
  class="sp-avatar"
  [class.sp-avatar--circle]="shape() === 'circle'"
  [class.sp-avatar--rounded]="shape() === 'rounded'"
  [class.sp-avatar--xs]="size() === 'xs'"
  [class.sp-avatar--sm]="size() === 'sm'"
  [class.sp-avatar--md]="size() === 'md'"
  [class.sp-avatar--lg]="size() === 'lg'"
  [class.sp-avatar--xl]="size() === 'xl'"
  [style.background]="shouldShowImage() ? null : avatarGradient()"
  [attr.aria-label]="(name() || alt() || 'Avatar') + (status() ? ' — ' + status() : '')"
  role="img">
  <!-- Region: User Photo Image -->
  @if (shouldShowImage()) {
    <img
      class="sp-avatar-img"
      [src]="src()"
      [alt]="alt() || name() || 'Avatar'"
      (error)="onImageError()" />
  } @else {
    <!-- Region: Initials Fallback -->
    <span
      class="sp-avatar-initials"
      aria-hidden="true">
      {{ initials() }}
    </span>
  }

  <!-- Region: Presence Status Dot -->
  @if (status()) {
    <span
      class="sp-avatar-status"
      [class.sp-avatar-status--online]="status() === 'online'"
      [class.sp-avatar-status--offline]="status() === 'offline'"
      [class.sp-avatar-status--busy]="status() === 'busy'"
      [class.sp-avatar-status--away]="status() === 'away'"
      [attr.title]="status()"
      aria-hidden="true"></span>
  }
</div>
