<!-- Region: Select Wrapper -->
<div class="sp-select-wrapper">
  <!-- Region: Label -->
  @if (this.label()) {
    <label
      class="sp-select-label"
      [attr.for]="this.id()"
      [style.color]="this.labelColor() || null">
      {{ this.label() }}
    </label>
  }

  <!-- Region: Native Select Container -->
  <div
    class="sp-select-container"
    [class.sp-select-sm]="this.size() === 'sm'"
    [class.sp-select-md]="this.size() === 'md'"
    [class.sp-select-lg]="this.size() === 'lg'"
    [class.has-error]="this.hasError()"
    [style.--sp-select-focus-color]="this.focusColor() || null"
    [class.is-disabled]="this.effectiveDisabled()">
    <select
      [id]="this.id()"
      class="sp-select-field"
      [disabled]="this.effectiveDisabled()"
      [attr.aria-invalid]="this.hasError()"
      [attr.aria-describedby]="this.hasError() && this.errorMessage() ? this.id() + '-error' : null"
      (change)="this.onSelectChange($event)"
      (blur)="this.onBlur()">
      @if (this.placeholder()) {
        <option
          value=""
          [disabled]="true"
          [selected]="!this.displayValue()">
          {{ this.placeholder() }}
        </option>
      }

      @for (option of this.options(); track option.value) {
        <option
          [value]="option.value"
          [disabled]="option.disabled ?? false"
          [selected]="option.value === this.displayValue()">
          {{ option.label }}
        </option>
      }
    </select>

    <!-- Region: Custom Dropdown Arrow -->
    <span
      class="sp-select-arrow"
      aria-hidden="true">
      <svg
        width="12"
        height="12"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </span>
  </div>

  <!-- Region: Error Message -->
  @if (this.hasError() && this.errorMessage()) {
    <p
      class="sp-select-error"
      [id]="this.id() + '-error'"
      role="alert">
      {{ this.errorMessage() }}
    </p>
  }

  <!-- Region: Hint -->
  @if (!this.hasError() && this.hint()) {
    <p class="sp-select-hint">
      {{ this.hint() }}
    </p>
  }
</div>
