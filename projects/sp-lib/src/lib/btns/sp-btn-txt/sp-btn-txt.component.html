<!-- Region: Text Button Template -->
<button
  type="button"
  class="sp-btn-txt"
  [disabled]="this.disabled()"
  [attr.aria-disabled]="this.disabled()"
  [style.color]="this.color()"
  [style.cursor]="this.disabled() ? 'not-allowed' : this.cursor()"
  (click)="this.onClick($event)">
  @if (this.text()) {
    {{ this.text() }}
  }
  <ng-content></ng-content>
</button>
